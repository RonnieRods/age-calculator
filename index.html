<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="node_modules/js-datepicker/dist/datepicker.min.css">
</head>
<body>
    <main>
        <h1>Age Calculator</h1>

        <form id="ageForm">
            <label for="age">Enter your birth date:</label>
            <input type="text" name="age" id="age" placeholder="Click to select date" autocomplete="off" readonly>
            <button type="submit" id="calculate">Calculate</button>
        </form>
        

        <div id="result">
            Select a date and click calculate!
        </div>
    </main>

    <!-- Initialize use of js-datepicker -->
    <script src="node_modules/js-datepicker/dist/datepicker.min.js"></script>

    <!-- Initialize the global file for luxon -->
    <script src="node_modules/luxon/build/global/luxon.js"></script>

    <!-- Changed to module type so Vite can parse the npm imports -->
    <script type="module" src="./script.js"></script>
</body>
</html>
